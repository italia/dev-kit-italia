<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Back - Test Web Components - vanilla-app</title>
    <link rel="stylesheet" href="@italia/dev-kit-italia/fonts.css" />
    <link rel="stylesheet" href="@italia/dev-kit-italia/styles.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="root">
      <header id="app-header"></header>
      <main class="container my-4">
        <h1>Back</h1>

        <section class="mb-4">
          <h2>Link</h2>
          <it-back>
            <a href="#" class="go-back">
              <it-icon name="it-arrow-left" size="sm" color="primary"></it-icon>
              <span>Torna indietro</span>
            </a>
          </it-back>
        </section>

        <section class="mb-4">
          <h2>Pulsanti</h2>
          <div class="d-flex gap-3 flex-wrap">
            <it-back>
              <it-button variant="primary" class="go-back">
                <it-icon name="it-arrow-left" size="sm" color="inverse"></it-icon>
                <span>Torna indietro</span>
              </it-button>
            </it-back>
            <it-back>
              <it-button variant="primary" class="go-back">
                <it-icon name="it-arrow-up" size="sm" color="inverse"></it-icon>
                <span>Torna indietro</span>
              </it-button>
            </it-back>
          </div>
        </section>

        <section class="mb-4">
          <h2>Navigazione personalizzata</h2>
          <p>
            L'evento `it-back-navigate` è cancelable. Chiamando `event.preventDefault()` impedisci
            `window.history.back()` e puoi gestire la navigazione indietro secondo il router del tuo framework.
          </p>
          <it-back id="back-custom">
            <a href="#" class="go-back">
              <it-icon name="it-arrow-left" size="sm" color="primary"></it-icon>
              <span>Torna indietro</span>
            </a>
          </it-back>
          <p id="back-status" class="mt-3" style="font-size: 0.9rem" role="status" aria-live="polite"></p>
        </section>
      </main>
      <div id="app-footer"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module">
      const back = document.getElementById('back-custom');
      back.addEventListener('it-back-navigate', (e) => {
        e.preventDefault();
        const status = document.getElementById('back-status');
        if (status) status.textContent = 'Navigazione indietro intercettata: la gestisce il tuo router.';
      });
    </script>
  </body>
</html>
