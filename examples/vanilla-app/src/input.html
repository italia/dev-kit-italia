<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Web Components - vanilla-app</title>
  <!-- Load compiled dev-kit CSS in <head> so styles are present even when JS is disabled -->
  <link rel="stylesheet" href="/node_modules/@italia/dev-kit-italia/dist/fonts.css" />
  <link rel="stylesheet" href="/node_modules/@italia/dev-kit-italia/dist/styles.css" />
  <!-- Local app styles so layout (#root etc.) is present without JS -->
  <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="root">
      <div id="app-header">
        <div class="app-header">
          <a href="https://vite.dev" target="_blank">
            <img src="/public/vite.svg" class="logo" alt="Vite logo" />
          </a>
          <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" target="_blank">
            <img src="/src/javascript.svg" class="logo vanilla" alt="JavaScript logo" />
          </a>
          <nav class="app-nav">
            <a href="/src/button">Button</a>
            <a href="/src/chip">Chip</a>
            <a href="/src/dropdown">Dropdown</a>
            <a href="/src/form">Form</a>
            <a href="/src/icon">Icon</a>
            <a href="/src/input">Input</a>
            <a href="/src/section">Section</a>
            <a href="/src/video">Video</a>
            <a href="/src/avatar">Avatar</a>
          </nav>
        </div>
      </div>
      <h1>it-input</h1>

      <it-input id="exampleInputText" label="Campo di testo" type="text" name="testo"></it-input>
      <it-input id="exampleInputEmail" label="Campo email" type="email" name="email"></it-input>
      <it-input id="exampleInputNumber" label="Campo numerico" type="number" name="number"></it-input>
      <it-input id="exampleInputTel" label="Campo telefonico" type="tel" name="telefono"></it-input>
      <it-input id="exampleInputTime" label="Campo orario" type="time" name="orario"></it-input>
      <it-input
        id="field-disabled-example"
        label="Campo disabilitato"
        type="text"
        name="field-disabled-example"
        disabled
      ></it-input>
      <it-input
        id="field-readonly-example"
        label="Campo readonly"
        type="text"
        name="field-readonly-example"
        readonly
        value="Contenuto in sola lettura"
      ></it-input>
      <it-input
        id="field-readonlyplaintext-example"
        label="Campo readonly normalizzato come plaintext"
        type="text"
        name="field-readonlyplaintext-example"
        readonly
        plaintext
        value="Contenuto in sola lettura"
      ></it-input>

      <it-input
        id="field-password-example"
        label="Campo password"
        type="password"
        name="field-password-example"
        support-text="Inserisci almeno 8 caratteri e alcuni caratteri speciali."
        minlength="8"
      ></it-input>
      <it-input
        id="field-password-strength-example"
        label="Campo password"
        type="password"
        name="field-password-strength-example"
        support-text="Inserisci almeno 8 caratteri e alcuni caratteri speciali."
        strength-meter
        minlength="8"
        suggestions
      ></it-input>
      <it-input
        id="textarea-example"
        label="Area di testo"
        type="textarea"
        name="textarea-example"
        placeholder="Testo segnaposto"
      ></it-input>
      <it-input
        id="required-example"
        label="Campo obbligatorio"
        type="text"
        name="required-example"
        required=""
        placeholder="Testo segnaposto"
      ></it-input>
      <it-input
        id="external-validation-example"
        label="Validazione esterna"
        type="text"
        name="external-validation-example"
        validity-message="Questo campo è obbligatorio!"
        placeholder="Testo segnaposto"
        custom-validation=""
      ></it-input>
    </div>
    <script type="module" src="/src/main.js"></script>


  </body>
</html>
